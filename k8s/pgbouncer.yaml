apiVersion: v1
kind: Service
metadata: {name: pgbouncer}
spec:
  selector: {app: pgbouncer}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pgbouncer}
spec:
  replicas: 2
  selector: {matchLabels: {app: pgbouncer}}
  template:
    metadata: {labels: {app: pgbouncer}}
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, valueFrom: {configMapKeyRef: {name: clicky-config, key: POSTGRES_DB}}}
            - {name: DB_USER, valueFrom: {configMapKeyRef: {name: clicky-config, key: POSTGRES_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: clicky-secrets, key: POSTGRES_PASSWORD}}}
            - {name: AUTH_TYPE, value: plain}
            - {name: POOL_MODE, value: transaction}
            - {name: MAX_CLIENT_CONN, value: "200"}
            - {name: DEFAULT_POOL_SIZE, value: "20"}
            - {name: MAX_PREPARED_STATEMENTS, value: "100"}
          readinessProbe: {tcpSocket: {port: postgres}, initialDelaySeconds: 5}
          livenessProbe: {tcpSocket: {port: postgres}, initialDelaySeconds: 15}
