apiVersion: batch/v1
kind: Job
metadata: {name: clickhouse-migrations}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: clickhouse/clickhouse-server:24.8
          command: [/bin/sh, /migrations/migrate.sh]
          env:
            - {name: CLICKHOUSE_HOST, value: clickhouse}
            - {name: CLICKHOUSE_DATABASE, valueFrom: {configMapKeyRef: {name: clicky-config, key: CLICKHOUSE_DATABASE}}}
            - {name: CLICKHOUSE_USER, valueFrom: {configMapKeyRef: {name: clicky-config, key: CLICKHOUSE_USER}}}
            - {name: CLICKHOUSE_PASSWORD, valueFrom: {secretKeyRef: {name: clicky-secrets, key: CLICKHOUSE_PASSWORD}}}
          volumeMounts: [{name: migrations, mountPath: /migrations}]
      volumes:
        - name: migrations
          configMap: {name: clickhouse-migrations, defaultMode: 0755}
