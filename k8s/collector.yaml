apiVersion: v1
kind: Service
metadata: {name: collector}
spec:
  selector: {app: collector}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: collector}
spec:
  replicas: 2
  selector: {matchLabels: {app: collector}}
  template:
    metadata: {labels: {app: collector}}
    spec:
      containers:
        - name: collector
          image: clicky-go-collector:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: RABBITMQ_URL, valueFrom: {secretKeyRef: {name: clicky-secrets, key: RABBITMQ_URL}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: clicky-secrets, key: DATABASE_URL}}}
            - {name: RABBITMQ_QUEUE, valueFrom: {configMapKeyRef: {name: clicky-config, key: RABBITMQ_QUEUE}}}
            - {name: REDIS_URL, valueFrom: {configMapKeyRef: {name: clicky-config, key: REDIS_URL}}}
            - {name: RATE_LIMIT_PER_MINUTE, valueFrom: {configMapKeyRef: {name: clicky-config, key: RATE_LIMIT_PER_MINUTE}}}
            - {name: COLLECTOR_CORS_ORIGINS, valueFrom: {configMapKeyRef: {name: clicky-config, key: COLLECTOR_CORS_ORIGINS}}}
            - {name: COLLECTOR_PROXY_HEADER, valueFrom: {configMapKeyRef: {name: clicky-config, key: COLLECTOR_PROXY_HEADER}}}
            - {name: COLLECTOR_TRUSTED_PROXIES, valueFrom: {configMapKeyRef: {name: clicky-config, key: COLLECTOR_TRUSTED_PROXIES}}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
