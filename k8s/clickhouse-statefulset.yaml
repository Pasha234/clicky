apiVersion: v1
kind: Service
metadata: {name: clickhouse-headless}
spec:
  clusterIP: None
  selector: {app: clickhouse}
  ports: [{name: native, port: 9000, targetPort: native}]
---
apiVersion: v1
kind: Service
metadata: {name: clickhouse}
spec:
  selector: {app: clickhouse}
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: clickhouse}
spec:
  serviceName: clickhouse-headless
  replicas: 1
  selector: {matchLabels: {app: clickhouse}}
  template:
    metadata: {labels: {app: clickhouse}}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports: [{name: http, containerPort: 8123}, {name: native, containerPort: 9000}]
          env:
            - {name: CLICKHOUSE_DB, valueFrom: {configMapKeyRef: {name: clicky-config, key: CLICKHOUSE_DATABASE}}}
            - {name: CLICKHOUSE_USER, valueFrom: {configMapKeyRef: {name: clicky-config, key: CLICKHOUSE_USER}}}
            - {name: CLICKHOUSE_PASSWORD, valueFrom: {secretKeyRef: {name: clicky-secrets, key: CLICKHOUSE_PASSWORD}}}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
          volumeMounts: [{name: data, mountPath: /var/lib/clickhouse}]
          readinessProbe: {exec: {command: [sh, -c, clickhouse-client --query 'SELECT 1' --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD"]}, initialDelaySeconds: 10}
          livenessProbe: {tcpSocket: {port: native}, initialDelaySeconds: 20}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
