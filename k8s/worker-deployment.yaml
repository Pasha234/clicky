apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: clicky-go-worker:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: metrics, containerPort: 3001}]
          env:
            - {name: RABBITMQ_URL, valueFrom: {secretKeyRef: {name: clicky-secrets, key: RABBITMQ_URL}}}
            - {name: CLICKHOUSE_DSN, valueFrom: {secretKeyRef: {name: clicky-secrets, key: CLICKHOUSE_DSN}}}
            - {name: RABBITMQ_QUEUE, valueFrom: {configMapKeyRef: {name: clicky-config, key: RABBITMQ_QUEUE}}}
            - {name: BATCH_SIZE, valueFrom: {configMapKeyRef: {name: clicky-config, key: BATCH_SIZE}}}
            - {name: FLUSH_INTERVAL, valueFrom: {configMapKeyRef: {name: clicky-config, key: FLUSH_INTERVAL}}}
            - {name: MAX_INSERT_ATTEMPTS, valueFrom: {configMapKeyRef: {name: clicky-config, key: MAX_INSERT_ATTEMPTS}}}
            - {name: RETRY_INITIAL_DELAY, valueFrom: {configMapKeyRef: {name: clicky-config, key: RETRY_INITIAL_DELAY}}}
            - {name: RETRY_MAX_DELAY, valueFrom: {configMapKeyRef: {name: clicky-config, key: RETRY_MAX_DELAY}}}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
