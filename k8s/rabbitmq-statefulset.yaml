apiVersion: v1
kind: Service
metadata: {name: rabbitmq-headless}
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports: [{name: amqp, port: 5672, targetPort: amqp}]
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq}
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          env:
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {configMapKeyRef: {name: clicky-config, key: RABBITMQ_USER}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: clicky-secrets, key: RABBITMQ_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 10}
          livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 20}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
