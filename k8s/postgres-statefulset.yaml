apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: clicky-config, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: clicky-config, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: clicky-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: [sh, -c, pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"]}, initialDelaySeconds: 5}
          livenessProbe: {exec: {command: [sh, -c, pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"]}, initialDelaySeconds: 15}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
