apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clicky
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  rules:
    - host: clicky.local
      http:
        paths:
          - path: /collect
            pathType: Prefix
            backend: { service: { name: collector, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: admin, port: { name: http } } }
