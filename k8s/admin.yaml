apiVersion: v1
kind: Service
metadata: {name: admin}
spec:
  selector: {app: admin}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin}
spec:
  replicas: 2
  selector: {matchLabels: {app: admin}}
  template:
    metadata: {labels: {app: admin}}
    spec:
      containers:
        - name: admin
          image: clicky-go-admin:latest
          imagePullPolicy: IfNotPresent
          command: [sh, -c, php artisan serve --host=0.0.0.0 --port=8000]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: clicky-config}}]
          env:
            - {name: APP_KEY, valueFrom: {secretKeyRef: {name: clicky-secrets, key: ADMIN_APP_KEY}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: clicky-secrets, key: POSTGRES_PASSWORD}}}
            - {name: CLICKHOUSE_PASSWORD, valueFrom: {secretKeyRef: {name: clicky-secrets, key: CLICKHOUSE_PASSWORD}}}
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
